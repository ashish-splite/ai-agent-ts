server:
  port: 3000

redis:
  enabled: false
  url: redis://localhost:6379

postgres:
  enabled: false
  url: postgres://postgres:postgres@localhost:5432/app
  maxConnections: 10
  connectTimeoutSeconds: 5
  idleTimeoutSeconds: 20
  ssl: false

openai:
  enabled: false
  apiKey: ""
  model: gpt-4.1-mini
  maxTokens: 1024
  systemPrompt: You are a helpful assistant.