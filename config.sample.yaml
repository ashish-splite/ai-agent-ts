server:
  port: 3000

redis:
  url: redis://localhost:6379

postgres:
  url: postgres://postgres:postgres@localhost:5432/app
  maxConnections: 10
  connectTimeoutSeconds: 5
  idleTimeoutSeconds: 20
  ssl: false

openai:
  apiKey: replace-with-your-openai-api-key

observability:
  enabled: false
  serviceName: ai-agent
  # OTLP/HTTP collector base URL; /v1/{traces,metrics,logs} is appended.
  otlpEndpoint: http://localhost:4318
  metricExportIntervalMs: 10000
