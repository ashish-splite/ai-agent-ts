name: Build and Deploy Jarvis

on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-release
  cancel-in-progress: false

env:
  IMAGE_NAME: thedarkest22/jarvis
  IMAGE_TAG: ${{ github.sha }}

jobs:
  release:
    if: github.ref == 'refs/heads/work'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install and typecheck
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout infrastructure
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ARGO_INFRA_REPOSITORY || format('{0}/argo-infra', github.repository_owner) }}
          ref: ${{ vars.ARGO_INFRA_BRANCH }}
          token: ${{ secrets.ARGO_INFRA_TOKEN }}
          path: infra-repository

      - name: Update Helm image tag and push
        working-directory: infra-repository
        shell: bash
        run: |
          set -euo pipefail
          values_file=applications/jarvis/chart/values.yaml
          test -f "$values_file"

          run_yq() {
            docker run --rm --user "$(id -u):$(id -g)" \
              --volume "$PWD:/workdir" --workdir /workdir \
              --env IMAGE_TAG mikefarah/yq:4.44.3 "$@"
          }

          run_yq --exit-status '.image | has("tag")' "$values_file"
          run_yq --inplace '.image.tag = strenv(IMAGE_TAG)' "$values_file"

          if git diff --quiet -- "$values_file"; then
            echo "Image tag is already up to date."
            exit 0
          fi

          branch=$(git branch --show-current)
          test -n "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$values_file"
          git commit -m "chore(jarvis): deploy image $IMAGE_TAG"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"